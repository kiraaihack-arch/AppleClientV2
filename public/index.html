<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppleClient</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--border:rgba(255,255,255,0.06);--text:#fff;--muted:#6b7280;--accent:#7c3aed;--accent2:#a855f7}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#stars-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 20% 50%,#1a0533 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#001233 0%,transparent 60%),radial-gradient(ellipse at 60% 80%,#0d0020 0%,transparent 50%),#060010;pointer-events:none}
#app{position:relative;z-index:1}
</style>
</head>
<body>
<div id="stars-bg"></div>
<canvas id="stars-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>
<div id="app"></div>
<script>
// Звёзды
(function(){
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=innerWidth; c.height=innerHeight; }
  function init(){
    stars = [];
    for(let i=0;i<200;i++) stars.push({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.5+0.2,
      a:Math.random(), da:Math.random()*0.005+0.001,
      color:`hsl(${200+Math.random()*120},80%,80%)`
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.a+=s.da; if(s.a>1||s.a<0) s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=s.color.replace(')',`,${s.a})`).replace('hsl','hsla');
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  window.addEventListener('resize',()=>{ resize(); init(); });
})();
</script>
<script src="app.js"></script>
</body>
</html>
